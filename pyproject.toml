[project]
name = "nf-schema-builder"
version = "0.2.0"
description = "Build and edit JSON schemas for Nextflow pipelines in a local web editor."
readme = "README.md"
authors = []
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.20.0",
    "rich>=13.3.1",
    "typer>=0.15.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.2",
    "pyright>=1.1.350",
    "types-jsonschema>=4.20.0",
    "pre-commit>=3.5.0",
    "pytest>=8.1.1",
    "pytest-cov>=4.1.0",
    "hatchling",
]

[project.scripts]
nf-schema-builder = "nf_schema_builder.cli:app"
nfsb = "nf_schema_builder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The web editor is built by Vite into nf_schema_builder/static, which is not
# tracked by git but must be shipped in the wheel and the sdist.
[tool.hatch.build]
artifacts = ["nf_schema_builder/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["nf_schema_builder"]

[tool.hatch.build.targets.sdist]
include = ["/nf_schema_builder", "/tests", "/hatch_build.py", "/README.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py310"
line-length = 120


[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "N",  # pep8-naming
    "UP", # pyupgrade
    "D",  # pydocstyle
]
ignore = [
    "D203",  # 1 blank line required between summary line and description
    "D212",  # Multi-line docstring summary should start at the first line
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pyright]
include = ["nf_schema_builder", "tests", "hatch_build.py"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
pythonVersion = "3.10"
strictListInference = true
strictDictionaryInference = true
strictParameterNullCheck = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=nf_schema_builder --cov-report=term-missing"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
